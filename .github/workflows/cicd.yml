name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'src/**/*.py'
      - 'tests/**/*.py'
      - 'params.yaml'
      - 'data/**/*.dvc'
      - '.dvc/config'
      - 'requirements.txt'
      - '.github/workflows/cicd.yml'
  workflow_dispatch:

permissions:
  contents: read

# All releases share the same S3 current model key.
concurrency:
  group: income-api-deploy
  cancel-in-progress: false

env:
  AWS_DEFAULT_REGION: us-east-1
  AWS_REGION: us-east-1
  MLFLOW_TRACKING_URI: sqlite:///mlflow.db

jobs:
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: pytest tests/ -v

  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Configure AWS credentials
        env:
          STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}
        run: |
          python - <<'PY'
          import json
          import os
          try:
              credentials = json.loads(os.environ['STORAGE_CREDENTIALS'])
          except (KeyError, json.JSONDecodeError):
              raise SystemExit('STORAGE_CREDENTIALS must be valid AWS credentials JSON')
          if not isinstance(credentials, dict):
              raise SystemExit('STORAGE_CREDENTIALS must be a JSON object')
          names = {
              'aws_access_key_id': 'AWS_ACCESS_KEY_ID',
              'aws_secret_access_key': 'AWS_SECRET_ACCESS_KEY',
          }
          if 'aws_session_token' in credentials:
              names['aws_session_token'] = 'AWS_SESSION_TOKEN'
          values = {}
          for key, name in names.items():
              value = credentials.get(key)
              if not isinstance(value, str) or not value or any(ord(c) < 33 or ord(c) == 127 for c in value):
                  raise SystemExit('STORAGE_CREDENTIALS contains a missing or invalid AWS credential')
              values[name] = value
          # Mask individual credentials before exporting them; no raw logging.
          for value in values.values():
              print('::add-mask::' + value.replace('%', '%25'), flush=True)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env_file:
              for name, value in values.items():
                  env_file.write(f'{name}={value}\n')
          PY
      - name: Verify AWS identity
        run: |
          python - <<'PY'
          import boto3
          if boto3.client('sts').get_caller_identity()['Arn'].endswith(':root'):
              raise SystemExit('AWS root credentials are not permitted')
          PY
      - name: Pull Step 2 data with DVC
        run: dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc
      - name: Train model using params.yaml
        run: python src/train.py
      - name: Read positive-class F1
        id: read_report
        run: |
          python - <<'PY'
          import json
          import math
          import os
          with open('outputs/report.json', encoding='utf-8') as report_file:
              f1 = float(json.load(report_file)['f1_score'])
          if not math.isfinite(f1) or not 0 <= f1 <= 1:
              raise SystemExit('Invalid positive-class F1 in report.json')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'f1={f1}\n')
          print(f'Positive-class F1: {f1:.6f}')
          PY
      - name: Save trained model and report for release
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: |
            models/model.joblib
            outputs/report.json
          if-no-files-found: error

  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:
      - name: Check positive-class F1 >= 0.65
        env:
          F1: ${{ needs.train.outputs.f1 }}
        run: |
          python - <<'PY'
          import math
          import os
          f1 = float(os.environ['F1'])
          if not math.isfinite(f1) or not 0.65 <= f1 <= 1:
              raise SystemExit(f'FAILED: positive-class f1_score {f1} must be >= 0.65 and <= 1. Deploy blocked.')
          print(f'PASSED: positive-class f1_score {f1:.6f} >= 0.65')
          PY

  release:
    name: Release
    needs: [train, quality-gate]
    runs-on: ubuntu-latest
    env:
      ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download quality-approved model
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: .
      - name: Configure AWS credentials
        env:
          STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}
        run: |
          python - <<'PY'
          import json
          import os
          try:
              credentials = json.loads(os.environ['STORAGE_CREDENTIALS'])
          except (KeyError, json.JSONDecodeError):
              raise SystemExit('STORAGE_CREDENTIALS must be valid AWS credentials JSON')
          if not isinstance(credentials, dict):
              raise SystemExit('STORAGE_CREDENTIALS must be a JSON object')
          names = {
              'aws_access_key_id': 'AWS_ACCESS_KEY_ID',
              'aws_secret_access_key': 'AWS_SECRET_ACCESS_KEY',
          }
          if 'aws_session_token' in credentials:
              names['aws_session_token'] = 'AWS_SESSION_TOKEN'
          values = {}
          for key, name in names.items():
              value = credentials.get(key)
              if not isinstance(value, str) or not value or any(ord(c) < 33 or ord(c) == 127 for c in value):
                  raise SystemExit('STORAGE_CREDENTIALS contains a missing or invalid AWS credential')
              values[name] = value
          for value in values.values():
              print('::add-mask::' + value.replace('%', '%25'), flush=True)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env_file:
              for name, value in values.items():
                  env_file.write(f'{name}={value}\n')
          PY
      - name: Verify AWS identity
        run: |
          python - <<'PY'
          import boto3
          if boto3.client('sts').get_caller_identity()['Arn'].endswith(':root'):
              raise SystemExit('AWS root credentials are not permitted')
          PY
      - name: Upload approved model to S3
        run: |
          python - <<'PY'
          import os
          import boto3
          boto3.client('s3').upload_file(
              'models/model.joblib',
              os.environ['ARTIFACT_BUCKET'],
              'artifacts/current/model.joblib',
          )
          PY
      - name: Copy serving code to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: src/serve.py
          target: /home/${{ secrets.SERVER_USER }}/src/
          strip_components: 1
          overwrite: true
      - name: Restart and verify EC2 API
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -eu
            sudo systemctl restart income-api
            curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 3 --max-time 5 http://localhost:8080/healthz
            sudo systemctl is-active --quiet income-api
            curl --fail --silent --show-error --max-time 5 -X POST http://localhost:8080/score -H 'Content-Type: application/json' -d '{"features":[28,2,14,2,11,0,1,0,0,45]}'
